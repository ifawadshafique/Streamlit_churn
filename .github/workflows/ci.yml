name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (data -> clean -> features -> train)
        run: |
          python src/generate_data.py
          python src/preprocessing.py
          python src/feature_engineering.py
          python src/train.py

      - name: Run tests
        run: pytest tests/ -v

      - name: Lint with flake8 (non-blocking)
        run: |
          pip install flake8
          flake8 src/ app/ --max-line-length=120 --exit-zero

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t customer-churn-platform:ci .
